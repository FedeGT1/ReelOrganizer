<p class="ai-notice">Hai già salvato questo reel per "{{ existing_location_name }}"{% if existing_note %}: {{ existing_note }}{% endif %}. Salvarlo comunque per i luoghi selezionati?</p>
<form hx-post="/ui/ai/multi/confirm" hx-target="#ai-chat-panel" hx-swap="innerHTML" class="ai-confirm-form multi-place-form">
    <input type="hidden" name="confirm_duplicate" value="true">
    <input type="hidden" name="link" value="{{ link }}">
    {% for sid in session_ids %}<input type="hidden" name="session_ids" value="{{ sid }}">{% endfor %}
    {% for pj in place_json %}<input type="hidden" name="place_json" value='{{ pj }}'>{% endfor %}
    <input type="hidden" name="caption" value="{{ caption }}">
    <input type="hidden" name="transcript" value="{{ transcript }}">
    <button type="submit">Salva comunque</button>
    <button type="button" hx-get="/ui/ai/panel" hx-target="#ai-chat-panel" hx-swap="innerHTML">Annulla</button>
</form>
