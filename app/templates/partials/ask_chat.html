{% if notice %}
<p class="ask-notice">{{ notice }}</p>
{% endif %}

<div id="ask-chat-messages">
    {% for turn in history %}
        {% if turn.role == 'user' %}
        <div class="chat-bubble user">{{ turn.text }}</div>
        {% else %}
        <div class="chat-bubble assistant">{{ turn.text }}</div>
        {% endif %}
    {% endfor %}
</div>

<form hx-post="/ui/ask/message" hx-target="#ask-chat-panel" hx-swap="innerHTML" class="ask-input-form">
    <input type="hidden" name="session_id" value="{{ session_id }}">
    <input type="hidden" name="location_id" value="{{ location_id }}">
    <input type="hidden" name="category_key" value="{{ category_key }}">
    <textarea name="message" placeholder="Scrivi la tua domanda..." required></textarea>
    <button type="submit">Invia</button>
</form>
