{% extends "base.html" %}
{% block content %}
<section class="login-form">
    <h2>Accedi</h2>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
        <label>Username
            <input type="text" name="username" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button type="submit">Accedi</button>
    </form>
</section>
{% endblock %}
