[project]
name = "reelorganizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "anthropic>=0.69.0",
    "yt-dlp>=2024.12.0",
    "faster-whisper>=1.0.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# required-environments only guarantees *some* wheel exists for the arch/os
# markers above; it can't express a minimum macOS deployment target. Newer
# onnxruntime releases (1.20+) ship macosx_13_0-tagged wheels, which are
# incompatible with older macOS x86_64 hosts (e.g. macOS 12.x) even though
# the arch/os marker matches. Pin to the last release confirmed to ship
# macosx_10_15_x86_64 wheels for cp311, still within faster-whisper's
# `onnxruntime>=1.14,<2` constraint.
constraint-dependencies = [
    "onnxruntime==1.16.3",
]
